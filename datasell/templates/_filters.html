<details class="panel" {{ 'open' if filters or s is defined }}>
<summary>Filters{% if filters %} ({{ filters|length }} active){% endif %}</summary>
<form class="filters" method="get" style="margin-top:12px">
  {% if s is defined %}
  <div><label>Group by</label>
    <select name="group_by">{% for o in group_options %}<option {{ 'selected' if s.group_by == o }}>{{ o }}</option>{% endfor %}</select></div>
  <div><label>Min listings per group</label><input type="number" name="min_count" min="1" value="{{ min_count }}"></div>
  {% endif %}
  <div class="wide"><label>Search title</label><input name="q" value="{{ filters.q or '' }}" placeholder="e.g. 501 selvedge"></div>
  {% for f in ['brand','category','department','size','color','material','condition','era'] %}
  <div><label>{{ f|capitalize }}</label>
    <select name="{{ f }}"><option value="">Any</option>
      {% for v in facets[f] %}<option {{ 'selected' if filters.get(f) == v }}>{{ v }}</option>{% endfor %}
    </select></div>
  {% endfor %}
  <div><label>Min price</label><input name="min_price" type="number" step="0.01" value="{{ filters.min_price or '' }}"></div>
  <div><label>Max price</label><input name="max_price" type="number" step="0.01" value="{{ filters.max_price or '' }}"></div>
  <div><label>Sold from</label><input name="date_from" type="date" value="{{ filters.date_from or '' }}"></div>
  <div><label>Sold to</label><input name="date_to" type="date" value="{{ filters.date_to or '' }}"></div>
  <div><label><input type="checkbox" name="vintage" value="1" {{ 'checked' if filters.vintage }}> Vintage only</label></div>
  <div class="actions"><button>Apply</button><a class="btn secondary" href="?">Reset</a></div>
</form>
</details>
