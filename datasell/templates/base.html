<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Datasell{% endblock %} · Datasell</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='icon-192.png') }}">
  <meta name="theme-color" content="#2f5d50">
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="{{ url_for('browse') }}">Datasell</a>
    <nav>
      <a href="{{ url_for('check_item') }}" class="{{ 'active' if request.endpoint in ('check_item', 'check_result') }}">Check item</a>
      {% if not simple_menu %}
      <a href="{{ url_for('fast_sellers') }}" class="{{ 'active' if request.endpoint == 'fast_sellers' }}">Fast sellers</a>
      <a href="{{ url_for('browse') }}" class="{{ 'active' if request.endpoint == 'browse' }}">Solds</a>
      <a href="{{ url_for('searches') }}" class="{{ 'active' if request.endpoint == 'searches' }}">Daily updates</a>
      <a href="{{ url_for('stats_page') }}" class="{{ 'active' if request.endpoint == 'stats_page' }}">Price stats</a>
      <a href="{{ url_for('add') }}" class="{{ 'active' if request.endpoint == 'add' }}">Add URLs</a>
      {% endif %}
      <a href="{{ url_for('settings_page') }}" class="{{ 'active' if request.endpoint == 'settings_page' }}">Settings</a>
    </nav>
  </div>
</header>
<main class="wrap">
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ cat }}">{{ msg }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
