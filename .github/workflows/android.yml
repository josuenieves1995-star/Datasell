name: Android app

on:
  push:
    branches: [main, claude/ebay-clothing-db]
    paths: ["datasell/**", "android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK as a release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Chaquopy needs the same Python version as the app (3.13) on the build machine.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: bash android/prepare_python.sh

      # Optional: a permanent signing key kept in the repository's secrets, so
      # new versions install over old ones. Without it the APK is signed with a
      # throwaway key (see the README).
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.DATASELL_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/datasell.jks"
            echo "DATASELL_KEYSTORE=$RUNNER_TEMP/datasell.jks" >> "$GITHUB_ENV"
          fi

      - name: Build the phone APK and an emulator test APK
        working-directory: android
        env:
          DATASELL_KEYSTORE_PASSWORD: ${{ secrets.DATASELL_KEYSTORE_PASSWORD }}
          DATASELL_KEY_ALIAS: ${{ secrets.DATASELL_KEY_ALIAS }}
          DATASELL_KEY_PASSWORD: ${{ secrets.DATASELL_KEYSTORE_PASSWORD }}
          DATASELL_VERSION_CODE: ${{ github.run_number }}
          DATASELL_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Datasell.apk
          DATASELL_ABIS=x86_64 gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Datasell-emulator-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            Datasell.apk
            Datasell-emulator-test.apk

  # Install and exercise the app on a real Android emulator before publishing.
  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash android/smoke_test.sh Datasell-emulator-test.apk

  publish:
    needs: [build, emulator-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apks
      # Always available at .../releases/download/android-latest/Datasell.apk
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest Datasell.apk \
            --title "Datasell for Android (version 1.0.${{ github.run_number }})" \
            --notes "Download **Datasell.apk** below on your Android phone and open it to install. Tested on an Android emulator before publishing. Built from ${{ github.sha }}." \
            --target "${{ github.sha }}" --latest
